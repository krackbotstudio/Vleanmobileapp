name: vclean_laundry
description: Vclean customer laundry mobile app.
publish_to: none
version: 0.0.1+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  font_awesome_flutter: ^11.0.0
  http: ^1.6.0
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/vclean-logo.png
    - assets/dark-white-logo-big.png
    - assets/dark-white-chrome-icon.png
    - assets/tectangle-logo.png
    - assets/krackbot-logo.png
    - assets/service-icons/
